[package]
name = "forge-dsp"
version = "1.0.0"
description = "Forge DSP GUI as a desktop app"
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "forge_dsp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
serialport = "=4.10.1"
ureq = "=3.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
