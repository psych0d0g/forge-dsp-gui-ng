; ESP32 bridge: serves the web app and passes WebSocket lines to the Forge RS485 port.
; Build the web app first (npm run build in the repo root); scripts/web.py copies
; dist/index.html.gz into web/ (placeholder page if missing).
[platformio]
default_envs = esp32dev

[env]
platform = platformio/espressif32 @ 7.1.3
framework = espidf
monitor_speed = 115200
board_build.embed_files = web/index.html.gz
extra_scripts = pre:scripts/web.py

[env:esp32dev]
board = esp32dev
