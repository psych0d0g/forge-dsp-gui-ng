# Desktop app (Tauri, src-tauri/): Windows (setup exe, msi, portable exe), macOS (universal dmg),
# Linux (deb, rpm, AppImage, Flatpak). Tag v*: files to the GitHub release; "Run workflow": artifacts only.
name: desktop
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libudev-dev patchelf rpm
      - name: Rust targets (macOS universal)
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(node -p 'require("./package.json").version')"; fi
          echo "V=$v" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Build
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then npx tauri build --target universal-apple-darwin; else npx tauri build; fi
      - name: Collect
        run: |
          mkdir -p out
          b=src-tauri/target
          case "$RUNNER_OS" in
            Linux)
              cp $b/release/bundle/deb/*.deb "out/forge-dsp-$V-linux-amd64.deb"
              cp $b/release/bundle/rpm/*.rpm "out/forge-dsp-$V-linux-x86_64.rpm"
              cp $b/release/bundle/appimage/*.AppImage "out/forge-dsp-$V-linux-x86_64.AppImage" ;;
            Windows)
              cp $b/release/bundle/nsis/*.exe "out/forge-dsp-$V-win-x64-setup.exe"
              cp $b/release/bundle/msi/*.msi "out/forge-dsp-$V-win-x64.msi"
              cp $b/release/forge-dsp.exe "out/forge-dsp-$V-win-x64-portable.exe" ;;
            macOS)
              cp $b/universal-apple-darwin/release/bundle/dmg/*.dmg "out/forge-dsp-$V-mac-universal.dmg" ;;
          esac
          ls -la out
      - name: Flatpak
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//51 org.gnome.Sdk//51
          cp out/forge-dsp-$V-linux-amd64.deb flatpak/forge-dsp.deb
          flatpak-builder --user --force-clean --repo=fp-repo fp-build flatpak/io.github.psych0d0g.forgedsp.yml
          flatpak build-bundle fp-repo "out/forge-dsp-$V-linux-x86_64.flatpak" io.github.psych0d0g.forgedsp \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # release notes from docs/releases
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: app-*
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
          v="${GITHUB_REF_NAME#v}"
          notes=(--notes "Desktop-App der Forge-DSP-GUI. Web: https://psych0d0g.github.io/forge-dsp-gui-ng/")
          [ -f "$GITHUB_WORKSPACE/docs/releases/$v.md" ] && notes=(--notes-file "$GITHUB_WORKSPACE/docs/releases/$v.md")
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Forge DSP GUI $v" "${notes[@]}"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber *
