name: desktop

# The GUI as a desktop app (Electron, desktop/): AppImage, Windows exe (portable + installer), macOS dmg.
# Tag v*: attached to the GitHub release of that tag. Run workflow: artifacts only, for testing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/index.html

  app:
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: desktop/app
      - run: npm ci
      - name: Version from the tag (or a dev version)
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
      - run: npx electron-builder --publish never -c.extraMetadata.version=${{ env.APP_VERSION }}
        shell: bash  # PowerShell splits "-c.extraMetadata.version=…" on Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*.exe
            desktop/release/*.dmg
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # release notes from docs/releases
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
          v="${GITHUB_REF_NAME#v}"
          notes=(--notes "Desktop-App der Forge-DSP-GUI: Linux (AppImage), Windows (exe), macOS (dmg). Web: https://psych0d0g.github.io/forge-dsp-gui-ng/")
          [ -f "$GITHUB_WORKSPACE/docs/releases/$v.md" ] && notes=(--notes-file "$GITHUB_WORKSPACE/docs/releases/$v.md")
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Forge DSP GUI $v" "${notes[@]}"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber *
