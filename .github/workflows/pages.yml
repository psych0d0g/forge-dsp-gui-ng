name: pages

# Publishes the web app to GitHub Pages (repository setting: Pages source = GitHub Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:      # also after a firmware release, to offer it at once
  schedule:
    - cron: "17 4 * * *"  # daily: picks up new firmware releases

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/emsdk
          key: emsdk-6.0.13
      - name: Simulator of the firmware (tests, and next to the page)
        run: scripts/build-sim.sh tests/sim
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Only the page itself
        run: mkdir site && cp dist/index.html site/ && cp -r tests/sim site/sim
      - name: Firmware releases next to the page (GitHub serves release assets without CORS)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-firmware.mjs site/firmware
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
